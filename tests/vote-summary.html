<!doctype html>
<html lang="sk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vote summary visual test</title>
    <link rel="stylesheet" href="../styles.css?v=221">
  </head>
  <body>
    <main class="main">
      <section class="view-root">
        <section class="panel votes-dashboard">
          <div class="toolbar">
            <div><h2>Hlasovanie</h2><p class="muted">Kontrola osobného súhrnu vlastníka.</p></div>
          </div>
          <div class="vote-summary-grid">
            <article class="status-metric vote-summary-card"><div class="card-icon">1</div><span>Hlasovali vlastníci</span><strong>12</strong><small>Domová schôdza č. 33</small></article>
            <article class="status-metric vote-summary-card"><div class="card-icon">2</div><span>Za</span><strong class="is-textual">vlastník nehlasoval</strong><small>bez elektronicky odovzdaného hlasu</small></article>
            <article class="status-metric vote-summary-card"><div class="card-icon">3</div><span>Proti</span><strong class="is-textual">vlastník nehlasoval</strong><small>bez elektronicky odovzdaného hlasu</small></article>
            <article class="status-metric vote-summary-card"><div class="card-icon">4</div><span>Zdržal sa</span><strong class="is-textual">vlastník nehlasoval</strong><small>bez elektronicky odovzdaného hlasu</small></article>
          </div>
        </section>
      </section>
    </main>
  </body>
</html>
